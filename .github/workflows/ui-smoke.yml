name: Android UI regression
on:
  push:
    branches: [main, fix/voice-background-whatsapp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JARVIS_EMULATOR: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Fetch bundled Hey Jarvis model
        run: bash scripts/fetch-wake-models.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native libraries for emulator
        run: |
          curl -fsSL -o /tmp/sherpa.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2
          mkdir -p /tmp/sherpa && tar xjf /tmp/sherpa.tar.bz2 -C /tmp/sherpa
          mkdir -p app/src/main/jniLibs/x86_64
          cp /tmp/sherpa/jniLibs/x86_64/libsherpa-onnx-jni.so /tmp/sherpa/jniLibs/x86_64/libonnxruntime.so app/src/main/jniLibs/x86_64/
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: |
            adb shell settings put system screen_off_timeout 2147483647
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put secure show_ime_with_hard_keyboard 1
            gradle --no-daemon :app:testDebugUnitTest :app:connectedDebugAndroidTest || { adb pull /sdcard/Download/jarvis-screenshots screenshots || true; adb shell dumpsys window > windows-on-failure.txt; exit 1; }
            adb pull /sdcard/Download/jarvis-screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-UI-results
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            screenshots
            windows-on-failure.txt
