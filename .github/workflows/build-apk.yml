name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Fetch bundled Hey Jarvis model
        run: bash scripts/fetch-wake-models.sh

      - name: Accetta licenze Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Scarica librerie native sherpa-onnx (v1.13.8, solo arm64-v8a)
        run: |
          mkdir -p app/src/main/jniLibs
          curl -fsSL -o /tmp/sherpa-android.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2
          mkdir -p /tmp/sherpa && tar xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/sherpa/jniLibs/arm64-v8a/libsherpa-onnx-jni.so app/src/main/jniLibs/arm64-v8a/
          cp /tmp/sherpa/jniLibs/arm64-v8a/libonnxruntime.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a

      # Chiave di firma: 1) secret GitHub (consigliato, stabile) 2) keystore in cache (stabile finché la cache vive)
      - name: Ripristina keystore da cache
        id: kscache
        uses: actions/cache@v4
        with:
          path: jarvis-ci.jks
          key: jarvis-keystore-v1

      - name: Prepara firma
        env:
          KS_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/jarvis.jks"
            echo "JARVIS_KEYSTORE_FILE=$RUNNER_TEMP/jarvis.jks" >> "$GITHUB_ENV"
            echo "JARVIS_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "JARVIS_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "JARVIS_KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "Firma: keystore da secret"
          else
            if [ ! -f jarvis-ci.jks ]; then
              keytool -genkeypair -v -keystore jarvis-ci.jks -storetype PKCS12 -alias jarvis \
                -keyalg RSA -keysize 3072 -validity 10950 -storepass "jarvis-ci-pass" -keypass "jarvis-ci-pass" \
                -dname "CN=Jarvis AI personale, O=Personale, C=IT"
              echo "Firma: nuovo keystore generato (verrà messo in cache)"
            else
              echo "Firma: keystore da cache"
            fi
            echo "JARVIS_KEYSTORE_FILE=$GITHUB_WORKSPACE/jarvis-ci.jks" >> "$GITHUB_ENV"
            echo "JARVIS_KEYSTORE_PASSWORD=jarvis-ci-pass" >> "$GITHUB_ENV"
            echo "JARVIS_KEY_ALIAS=jarvis" >> "$GITHUB_ENV"
            echo "JARVIS_KEY_PASSWORD=jarvis-ci-pass" >> "$GITHUB_ENV"
          fi

      - name: Build APK release
        id: build
        continue-on-error: true
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease :app:testDebugUnitTest 2>&1 | tee build.log

      - name: Pubblica estratto del log sul branch ci-logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs && cd /tmp/logs && git init -q && git checkout -q -b ci-logs
          cp "$GITHUB_WORKSPACE/build.log" full.log 2>/dev/null || echo "nessun log" > full.log
          grep -E "^e: |^w: .*(Unresolved|deprecat)|FAILED|What went wrong|Execution failed|Could not|error:|Caused by|Tests? .*(failed|FAILED)" full.log | head -300 > errors.txt || true
          tail -120 full.log > tail.txt
          rm full.log
          echo "run ${{ github.run_number }} esito: ${{ steps.build.outcome }}" > status.txt
          git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -q -m "log build ${{ github.run_number }}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -q -f origin ci-logs

      - name: Esito build
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Rinomina APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Jarvis-AI-0.1.${{ github.run_number }}.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          unzip -l dist/*.apk | grep -E "libsherpa|libonnxruntime" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-AI-apk
          path: dist/*
          retention-days: 30

      - name: Pubblica release (solo su main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" dist/* \
            --title "Jarvis AI 0.1.${{ github.run_number }}" \
            --notes "Build automatica. Vedi README per installazione e limiti." \
            --prerelease
